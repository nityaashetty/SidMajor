data:
  fs_in: 200
  fs: 100
  bandpass:
  - 0.5
  - 45.0
  filter_order: 4
  clip_uv: 3000
  skip_start_sec: 10
  transition_guard_sec:
  - 1
  - 3
  artifact_guard_sec:
  - 2
  - 3
  join_guard_sec: 3
  long_artifact_sec: 30
  post_hv_sec: 60
  workers: 6
features:
  window_sec: 4
  step_sec: 2
  max_windows: 150
  normative: true
  normative_degree: 1
  z_clip: 6.0
