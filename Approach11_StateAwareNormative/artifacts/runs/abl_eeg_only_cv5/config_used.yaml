  seconds: 10
  use_events: true
  train_per_recording: 12
  eval_per_recording: 24
  state_mix:
    eyes_closed: 0.6
    eyes_open: 0.25
    photic: 0.15
  signal_clip: 10.0
model:
  kernels:
  - 11
  - 25
  - 51
  filters_per_kernel: 8
  depth_multiplier: 2
  sep_filters: 64
  out_filters: 96
