experiment: sanf_net
paths:
  dataset_root: C:\Users\potda\Desktop\Major_Project_Final\caueeg-dataset
  artifacts: C:\Users\potda\Desktop\Major_Project_Final\Approach11_StateAwareNormative\artifacts
  store: C:\Users\potda\Desktop\Major_Project_Final\Approach11_StateAwareNormative\artifacts\store
  features: C:\Users\potda\Desktop\Major_Project_Final\Approach11_StateAwareNormative\artifacts\features
